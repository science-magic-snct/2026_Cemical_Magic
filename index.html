<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>化学マジック2026 | 化学の城ラピュタ</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
    }

    header {
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--accent-color);
      letter-spacing: 0.05em;
    }

    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .card h2 {
      margin-top: 0;
      color: var(--accent-color);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .video-container {
      position: relative;
      padding-bottom: 177.78%; /* 9:16 Aspect Ratio for Shorts */
      height: 0;
      overflow: hidden;
      max-width: 360px;
      margin: 1rem auto;
      border-radius: 8px;
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .svg-container {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    .svg-container svg {
      max-width: 100%;
      height: auto;
    }

    .caption {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 0.5rem;
    }

    .caption a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .caption a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border-color);
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>
